<style>
:root{
  --ink:#16211f; --paper:#f6f4ef; --surface:#ffffff; --surface-2:#fbfaf6;
  --line: rgba(22,33,31,.13); --line-strong: rgba(22,33,31,.24);
  --teal:#0f6e63; --teal-deep:#0a4a43; --teal-tint:#e4f0ee;
  --amber:#a3690f; --amber-tint:#faf1de;
  --rose:#a13a30; --rose-tint:#fbe9e7;
  --slate:#5c6d69; --slate-soft:#8a9a96;
  --shadow: 0 1px 2px rgba(22,33,31,.06), 0 8px 24px -12px rgba(22,33,31,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eaf1ee; --paper:#0f1512; --surface:#161f1c; --surface-2:#131c19;
    --line: rgba(234,241,238,.14); --line-strong: rgba(234,241,238,.26);
    --teal:#57d6c4; --teal-deep:#2fa091; --teal-tint: rgba(87,214,196,.14);
    --amber:#e3ac57; --amber-tint: rgba(227,172,87,.14);
    --rose:#e88276; --rose-tint: rgba(232,130,118,.14);
    --slate:#a6b7b2; --slate-soft:#7d8f8a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --ink:#eaf1ee; --paper:#0f1512; --surface:#161f1c; --surface-2:#131c19;
  --line: rgba(234,241,238,.14); --line-strong: rgba(234,241,238,.26);
  --teal:#57d6c4; --teal-deep:#2fa091; --teal-tint: rgba(87,214,196,.14);
  --amber:#e3ac57; --amber-tint: rgba(227,172,87,.14);
  --rose:#e88276; --rose-tint: rgba(232,130,118,.14);
  --slate:#a6b7b2; --slate-soft:#7d8f8a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.55);
}
*{box-sizing:border-box;}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  padding-inline:16px; padding-block: max(16px, env(safe-area-inset-top,0px)) max(28px, env(safe-area-inset-bottom,0px));
  font-size:14px; line-height:1.5;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
h1,h2,h3{font-family:"IBM Plex Sans",sans-serif; margin:0; text-wrap:balance;}
.wrap{max-width:1220px; margin:0 auto;}

.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-block:10px 18px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:34px; height:34px; border-radius:9px; background:linear-gradient(155deg,var(--teal),var(--teal-deep)); display:flex; align-items:center; justify-content:center; color:#fff; font-family:"IBM Plex Mono"; font-weight:600; font-size:14px; flex:none;}
.brand-name{font-weight:700; font-size:17px; letter-spacing:-.01em;}
.brand-sub{color:var(--slate); font-size:12px;}
.roleswitch{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px; box-shadow:var(--shadow);}
.roleswitch button{border:none; background:transparent; padding:8px 16px; border-radius:999px; font:inherit; font-weight:600; font-size:13px; color:var(--slate); cursor:pointer;}
.roleswitch button.active{background:var(--teal); color:#fff;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);}
.pad{padding:20px;}
.section-title{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--slate); font-weight:600; margin-bottom:10px;}

.login-shell{display:flex; justify-content:center; padding-block:40px;}
.login-card{width:100%; max-width:380px;}
.login-card input{width:100%; font:inherit; font-family:"IBM Plex Mono"; padding:11px 12px; border-radius:9px; border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink); margin-block:10px 6px;}
.login-card input:focus{outline:2px solid var(--teal); outline-offset:1px;}
.btn{font:inherit; font-weight:600; border:none; border-radius:9px; padding:10px 16px; cursor:pointer; background:var(--teal); color:#fff;}
.btn:hover{background:var(--teal-deep);}
.btn.ghost{background:transparent; color:var(--teal); border:1px solid var(--line-strong);}
.btn.sm{padding:6px 11px; font-size:12.5px; border-radius:7px;}
.btn.rose{background:var(--rose);} .btn.rose:hover{opacity:.9;}
.chip-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
.chip{font-family:"IBM Plex Mono"; font-size:12px; border:1px solid var(--line); background:var(--surface-2); color:var(--slate); border-radius:999px; padding:5px 10px; cursor:pointer;}
.chip:hover{border-color:var(--teal); color:var(--teal);}
.error-text{color:var(--rose); font-size:12.5px; min-height:16px; margin-top:2px;}
.hint{color:var(--slate-soft); font-size:11.5px; margin-top:4px;}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; overflow-x:auto;}
.tabs button{font:inherit; font-weight:600; font-size:13.5px; background:transparent; border:none; padding:10px 14px; color:var(--slate); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap;}
.tabs button.active{color:var(--teal); border-color:var(--teal);}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:16px;}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow);}
.stat .k{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--slate); font-weight:600;}
.stat .v{font-family:"IBM Plex Mono"; font-size:20px; font-weight:600; margin-top:4px;}
.stat .v.rose{color:var(--rose);} .stat .v.teal{color:var(--teal-deep);}
:root[data-theme="dark"] .stat .v.teal{color:var(--teal);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stat .v.teal{color:var(--teal);}}

.profile-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; margin-bottom:16px;}
.profile-name{font-size:19px; font-weight:700;}
.profile-meta{color:var(--slate); font-size:12.5px; margin-top:2px;}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:4px 9px; border-radius:999px;}
.badge.teal{background:var(--teal-tint); color:var(--teal-deep);}
.badge.amber{background:var(--amber-tint); color:var(--amber);}
.badge.rose{background:var(--rose-tint); color:var(--rose);}
.badge.slate{background:var(--line); color:var(--slate);}

.tbl-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:12px;}
table{border-collapse:collapse; width:100%; min-width:760px; background:var(--surface);}
table.narrow{min-width:560px;}
thead th{position:sticky; top:0; background:var(--surface-2); text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--slate); font-weight:600; padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
tbody td{padding:8px 10px; border-bottom:1px solid var(--line); font-size:12.8px; white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
tbody tr.row-wo{color:var(--slate-soft);}
td.note{white-space:normal; min-width:220px; color:var(--slate); font-size:12px;}
td.wrap-cell{white-space:normal; min-width:180px;}
.status-pill{font-family:"IBM Plex Mono"; font-size:11px; font-weight:600; padding:3px 7px; border-radius:6px; white-space:nowrap;}
.status-P{background:var(--teal-tint); color:var(--teal-deep);}
.status-CL{background:var(--amber-tint); color:var(--amber);}
.status-A{background:var(--rose-tint); color:var(--rose);}
.status-WO{background:var(--line); color:var(--slate);}
.status-H{background:#dbe8f7; color:#2b5f8a;}
.status-Open{background:var(--line); color:var(--slate);}
.status-InProgress{background:var(--amber-tint); color:var(--amber);}
.status-Review{background:#dbe8f7; color:#2b5f8a;}
.status-Done{background:var(--teal-tint); color:var(--teal-deep);}
.status-Pending{background:var(--amber-tint); color:var(--amber);}
.status-Approved{background:var(--teal-tint); color:var(--teal-deep);}
.status-Rejected{background:var(--rose-tint); color:var(--rose);}
.status-Accepted{background:var(--amber-tint); color:var(--amber);}
.status-Closed{background:var(--line); color:var(--slate);}
.prio-Low{color:var(--slate);} .prio-Medium{color:var(--amber); font-weight:600;} .prio-High{color:var(--rose); font-weight:600;}
.late-flag{color:var(--rose); font-weight:600;}
.grace-flag{color:var(--amber);}
.clickable-row{cursor:pointer;}

.emp-toolbar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
.planner-cell{position:relative; width:26px; height:26px; border-radius:7px; border:1px solid var(--line-strong); font-family:"IBM Plex Mono"; font-weight:700; font-size:11px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; color:#fff;}
.planner-cell.planner-g{background:var(--teal);}
.planner-cell.planner-s{background:var(--amber);}
.planner-cell.planner-n{background:var(--slate);}
.planner-cell.planner-x{background:var(--teal-deep);}
.planner-cell.planner-override{box-shadow:0 0 0 2px var(--paper), 0 0 0 4px gold;}
.planner-late-dot{position:absolute; top:-3px; right:-3px; width:8px; height:8px; border-radius:50%; background:var(--rose); border:1.5px solid var(--paper);}
.search{font:inherit; font-family:"IBM Plex Mono"; padding:8px 12px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink); min-width:200px;}
.iconbtn{border:1px solid var(--line-strong); background:var(--surface); border-radius:7px; padding:5px 9px; font-size:12px; cursor:pointer; color:var(--slate); font-weight:600;}
.iconbtn:hover{border-color:var(--teal); color:var(--teal);}
.iconbtn.danger:hover{border-color:var(--rose); color:var(--rose);}
.editable{background:transparent; border:1px solid transparent; border-radius:6px; padding:4px 6px; font:inherit; color:inherit; width:100%;}
.editable:focus{outline:none; border-color:var(--teal); background:var(--surface-2);}
select.editable{cursor:pointer;}

.modal-back{position:fixed; inset:0; background:rgba(10,16,14,.5); display:flex; align-items:flex-start; justify-content:center; padding:24px 16px; overflow-y:auto; z-index:20;}
.modal{background:var(--paper); border-radius:16px; max-width:980px; width:100%; margin-top:20px; box-shadow:var(--shadow); border:1px solid var(--line);}
.modal.narrow{max-width:520px;}
.modal-head{display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line);}
.modal-body{padding:20px;}
.closebtn{border:none; background:var(--surface-2); width:30px; height:30px; border-radius:8px; font-size:15px; cursor:pointer; color:var(--slate);}
.form-row{margin-bottom:12px;}
.form-row label{display:block; font-size:12px; font-weight:600; color:var(--slate); margin-bottom:5px;}
.form-row input, .form-row select, .form-row textarea{width:100%; font:inherit; padding:9px 11px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink);}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:520px){.form-grid{grid-template-columns:1fr;}}

.kpi-link{cursor:pointer;}
.list-plain{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
.list-plain li{display:flex; justify-content:space-between; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2); font-size:12.8px;}

.payslip{max-width:560px; margin:0 auto;}
.payslip-row{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--line); font-size:13px;}
.payslip-row.total{border-bottom:none; border-top:2px solid var(--ink); margin-top:6px; padding-top:12px; font-weight:700; font-size:15px;}
.payslip-row.deduct{color:var(--rose);}

.footnote{color:var(--slate-soft); font-size:11.5px; margin-top:14px; line-height:1.6;}
.hidden{display:none!important;}
a{color:var(--teal);}
@media print{
  .no-print{display:none!important;}
  body{background:#fff; color:#000;}
}
</style>

/* Shift Master: admin-configurable shift types. allowedLateMin = always-forgiven grace.
   allowedExtraLateMin = an extra grace band forgiven up to extraLateMaxPerMonth times/cycle;
   beyond that (or once the allowance is used up) the FULL late duration is charged. */
let SHIFT_MASTER = [
  {code:'S1', letter:'G', name:'General Shift', start:'09:00', end:'18:00', allowedLateMin:15, allowedExtraLateMin:15, extraLateMaxPerMonth:3},
  {code:'S2', letter:'S', name:'Second Shift',  start:'14:00', end:'23:00', allowedLateMin:15, allowedExtraLateMin:15, extraLateMaxPerMonth:3},
  {code:'S3', letter:'N', name:'Night Shift',   start:'20:00', end:'05:00', allowedLateMin:15, allowedExtraLateMin:15, extraLateMaxPerMonth:3},
];
const DEFAULT_MONTHLY_PERMISSION_MIN = 240;
const DEFAULT_MONTHLY_CL = 1;
const CONSOLIDATED_LEAVE_MIN = 480;
/* Pay cycle: 25th of a month to the 24th of the next. Indicative statutory rates below
   (PF/ESI/Professional Tax) are editable defaults, not authoritative — confirm actual
   applicable rates/slabs with your accountant before relying on them for real payroll. */
let PAYROLL_SETTINGS = {
  cycleStartDay: 25,
  pf: {enabled: true, rate: 12},
  esi: {enabled: true, rate: 0.75, ceiling: 21000},
  pt: {enabled: true, slabs: [
    {upto: 21000, amount: 0},
    {upto: 30000, amount: 135},
    {upto: 45000, amount: 315},
    {upto: 60000, amount: 690},
    {upto: 75000, amount: 1025},
    {upto: 99999999, amount: 1250},
  ]},
  ot: {enabled: true, multiplier: 1.5, graceMin: 15},
};
let HOLIDAYS = [{"date": "2026-08-28", "name": "Company Foundation Day"}, {"date": "2026-09-14", "name": "Ganesh Chaturthi"}];
function isHoliday(date){ return HOLIDAYS.some(h=>h.date===date); }
function ptFor(gross){
  if(!PAYROLL_SETTINGS.pt.enabled) return 0;
  const slab = PAYROLL_SETTINGS.pt.slabs.find(s=>gross<=s.upto);
  return slab ? slab.amount : 0;
}
function staffMonthlyCL(emp){ return emp.monthlyCL ?? DEFAULT_MONTHLY_CL; }
function staffMonthlyPermissionMin(emp){ return Math.round((emp.monthlyPermissionHours ?? (DEFAULT_MONTHLY_PERMISSION_MIN/60)) * 60); }
let TASK_TEMPLATES = [

];
let ROSTER = {}; // admin per-date overrides: ROSTER["<empNo>|<date>"] = shift code
function rosterKey(empNo, date){ return empNo+'|'+date; }
function shiftByCode(code){ return SHIFT_MASTER.find(s=>s.code===code); }
function nextShiftCode(code){ const i = SHIFT_MASTER.findIndex(s=>s.code===code); return SHIFT_MASTER[(i+1)%SHIFT_MASTER.length].code; }
function shiftStartMin(s){ return toMin(s.start); }
function nearestShift(inMin){
  let best=SHIFT_MASTER[0], bd=Infinity;
  for(const s of SHIFT_MASTER){ const d=Math.abs(inMin-shiftStartMin(s)); if(d<bd){ bd=d; best=s; } }
  return best;
}
/* Resolution order for a given staff+date: (1) Shift Planner override, (2) the staff's
   Shift Master mapping from Staff Master, (3) auto-detect nearest shift from IN time. */
function effectiveShift(empNo, date, inMin){
  const override = ROSTER[rosterKey(empNo, date)];
  if(override) return shiftByCode(override);
  const emp = findStaff(empNo);
  if(emp && emp.shiftCode && shiftByCode(emp.shiftCode)) return shiftByCode(emp.shiftCode);
  return nearestShift(inMin);
}
function isOverridden(empNo, date){ return !!ROSTER[rosterKey(empNo, date)]; }

function toMin(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
function fmtMoney(n){ return '₹' + Math.round(n).toLocaleString('en-IN'); }
function fmtMin(n){ if(n<=0) return '—'; const h=Math.floor(n/60), m=Math.round(n%60); return h? (h+'h '+(m?m+'m':'')) : m+'m'; }
function dayName(iso){ return new Date(iso+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short'}); }
function fmtDate(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); }
function findStaff(empNo){ return STAFF.find(s=>s.empNo===empNo); }

function computeCycle(empNo){
  const emp = findStaff(empNo);
  const att = ATTENDANCE[empNo];
  if(!emp || !att) return null;
  const records = att.records;
  const cycleLen = records.length;
  const perDay = emp.netSalary / cycleLen;
  const perMinute = perDay / 8 / 60;

  const monthlyPermissionMin = staffMonthlyPermissionMin(emp);
  const monthlyCL = staffMonthlyCL(emp);
  let permissionRemaining = monthlyPermissionMin;
  let clRemaining = monthlyCL;
  let cumulativeUncovered = 0;
  let totalDeduction = 0;
  let otMinutesTotal = 0;
  const extraLateUsed = {}; // per shift code, this cycle
  const rows = [];

  for(const rec of records){
    const row = {date:rec.date, status:rec.status, shift:null, inTime:rec.in||'', outTime:rec.out||'',
                 lateMin:0, permUsed:0, deduction:0, note:'', otMin:0};

    if(isHoliday(rec.date)){
      row.status = 'H';
      row.note = 'Declared holiday - no impact regardless of punch';
    } else if(rec.status==='WO' || rec.status==='H'){
      // no work scheduled
    } else if(rec.status==='CL'){
      if(clRemaining>0){ clRemaining--; row.note='Casual leave (paid)'; }
      else { row.deduction=perDay; totalDeduction+=perDay; row.note='CL quota exhausted - day unpaid'; }
      if(rec.permMin){
        const used = Math.min(rec.permMin, permissionRemaining);
        permissionRemaining -= used;
        row.permUsed = used;
        row.note += ' + ' + used + ' min permission also used';
      }
    } else if(rec.status==='A'){
      if(clRemaining>0){ clRemaining--; row.note='Unplanned absence - auto-covered by CL'; }
      else { row.deduction=perDay; totalDeduction+=perDay; row.note='Unplanned absence - loss of pay'; }
    } else if(rec.status==='P'){
      const inMin = toMin(row.inTime);
      const shift = effectiveShift(empNo, rec.date, inMin);
      row.shift = shift;
      row.shiftOverridden = isOverridden(empNo, rec.date);
      const late = Math.max(0, inMin - shiftStartMin(shift));
      row.lateMin = late;
      const grace = shift.allowedLateMin ?? 15;
      const extraBand = shift.allowedExtraLateMin ?? 0;
      const extraCap = shift.extraLateMaxPerMonth ?? 0;
      extraLateUsed[shift.code] = extraLateUsed[shift.code] || 0;

      if(late === 0){
        row.note = 'On time';
      } else if(late <= grace){
        row.note = late+'m late - inside the '+grace+'m grace for '+shift.name+', no impact';
      } else if(late <= grace+extraBand && extraLateUsed[shift.code] < extraCap){
        extraLateUsed[shift.code]++;
        row.note = late+'m late - covered by monthly extra-late allowance ('+extraLateUsed[shift.code]+'/'+extraCap+' used on '+shift.name+')';
      } else {
        const fromPerm = Math.min(late, permissionRemaining);
        permissionRemaining -= fromPerm;
        row.permUsed = fromPerm;
        const uncovered = late - fromPerm;

        if(uncovered > 0){
          const ded = uncovered * perMinute;
          row.deduction += ded;
          totalDeduction += ded;
          row.note = fromPerm>0
            ? fromPerm+'m absorbed by permission, '+uncovered+'m deducted from pay'
            : uncovered+'m late deducted from pay (permission pool empty)';

          cumulativeUncovered += uncovered;
          while(cumulativeUncovered >= CONSOLIDATED_LEAVE_MIN){
            cumulativeUncovered -= CONSOLIDATED_LEAVE_MIN;
            if(clRemaining>0){
              clRemaining--;
              row.deduction -= perDay;
              totalDeduction -= perDay;
              row.note += ' · 8h consolidated lateness offset using CL';
            } else {
              row.note += ' · 8h consolidated lateness = 1 day loss of pay';
            }
          }
        } else {
          row.note = fromPerm+'m late fully absorbed by permission balance';
        }
      }

      // Overtime: minutes worked past shift end, for OT-eligible staff on non-overnight shifts.
      if(emp.otEligible && PAYROLL_SETTINGS.ot.enabled && row.outTime){
        const endMin = shiftStartMin({start:shift.end});
        const startMin = shiftStartMin(shift);
        if(endMin > startMin){ // skip overnight shifts crossing midnight - not modeled yet
          const outMin = toMin(row.outTime);
          const over = outMin - endMin - (PAYROLL_SETTINGS.ot.graceMin||0);
          if(over > 0){ row.otMin = over; otMinutesTotal += over; }
        }
      }
    }

    row.permissionRemaining = permissionRemaining;
    row.clRemaining = clRemaining;
    row.runningDeduction = totalDeduction;
    row.runningNet = emp.netSalary - totalDeduction;
    rows.push(row);
  }

  const grossPay = emp.netSalary;
  const pfDeduction = (PAYROLL_SETTINGS.pf.enabled && (emp.pfApplicable??true)) ? grossPay*PAYROLL_SETTINGS.pf.rate/100 : 0;
  const esiEligible = emp.esiApplicable ?? (grossPay<=PAYROLL_SETTINGS.esi.ceiling);
  const esiDeduction = (PAYROLL_SETTINGS.esi.enabled && esiEligible && grossPay<=PAYROLL_SETTINGS.esi.ceiling) ? grossPay*PAYROLL_SETTINGS.esi.rate/100 : 0;
  const ptDeduction = ptFor(grossPay);
  const otherDeduction = emp.otherDeduction || 0;
  const statutoryDeduction = pfDeduction + esiDeduction + ptDeduction + otherDeduction;
  const otPay = PAYROLL_SETTINGS.ot.enabled ? (otMinutesTotal/60) * (perDay/8) * PAYROLL_SETTINGS.ot.multiplier : 0;

  const summary = {
    perDay, perMinute, grossPay,
    monthlyPermissionMin, monthlyCL,
    permissionRemaining, permissionUsed: monthlyPermissionMin - permissionRemaining,
    clRemaining, clUsed: monthlyCL - clRemaining,
    totalDeduction,
    pfDeduction, esiDeduction, ptDeduction, otherDeduction, statutoryDeduction,
    otMinutesTotal, otPay,
    finalNet: grossPay - totalDeduction - statutoryDeduction + otPay,
    presentDays: rows.filter(r=>r.status==='P').length,
    lateDays: rows.filter(r=>r.lateMin>(r.shift?(r.shift.allowedLateMin??15):15)).length,
    woDays: rows.filter(r=>r.status==='WO').length,
    holidayDays: rows.filter(r=>r.status==='H').length,
    clDays: rows.filter(r=>r.status==='CL').length,
    absentDays: rows.filter(r=>r.status==='A').length,
    cycleLen,
  };
  return {emp, rows, summary, primaryShift: att.primaryShift};
}

function taskRow(t, opts){
  opts = opts || {};
  const a = findStaff(t.assignedTo), byStaff = findStaff(t.assignedBy);
  const byName = byStaff ? byStaff.name : (accountName(t.assignedBy) || t.assignedBy);
  const noteParts = [];

/* ================= Single active session (simulated) =================
   Only one device can be signed in per account at a time. Each browser tab
   gets its own deviceId (sessionStorage); the currently-logged-in account's
   lock is shared across tabs of the same browser (localStorage), so signing
   in with the same credentials in a second tab immediately signs the first
   one out — a same-browser stand-in for what real cross-device single-session
   enforcement (Supabase session table + realtime) would do in the Lovable build. */
const DEVICE_ID = (function(){
  let id = sessionStorage.getItem('deviceId');
  if(!id){ id = 'dev_'+Math.random().toString(36).slice(2,10); sessionStorage.setItem('deviceId', id); }
  return id;
})();
let mySessionKey = null;
function claimSession(acctId){
  mySessionKey = 'acct:'+acctId;
  localStorage.setItem(mySessionKey, JSON.stringify({deviceId:DEVICE_ID, ts:Date.now()}));
}
function releaseSession(){
  if(mySessionKey){
    try{
      const cur = JSON.parse(localStorage.getItem(mySessionKey)||'null');
      if(cur && cur.deviceId===DEVICE_ID) localStorage.removeItem(mySessionKey);
    }catch(e){}
    mySessionKey = null;
  }
}
window.addEventListener('storage', (e)=>{
  if(!mySessionKey || e.key!==mySessionKey) return;
  try{
    const val = e.newValue ? JSON.parse(e.newValue) : null;
    if(!val || val.deviceId!==DEVICE_ID) handleSessionTakeover();
  }catch(err){}
});
function handleSessionTakeover(){
  const wasStaff = !!currentStaff;
  currentStaff = null; adminLoggedIn = false; currentAdminAccount = null; mySessionKey = null;
  const msg = 'You were signed out because this account signed in on another device.';
  if(wasStaff){
    document.querySelectorAll('#roleSwitch button').forEach(b=>b.classList.toggle('active', b.dataset.role==='staff'));
    staffView.classList.remove('hidden'); adminView.classList.add('hidden');
    renderStaffLogin(msg);
  } else {
    document.querySelectorAll('#roleSwitch button').forEach(b=>b.classList.toggle('active', b.dataset.role==='admin'));
    adminView.classList.remove('hidden'); staffView.classList.add('hidden');
    renderAdminLogin(msg);
  }
}

function deptName(code){ const d = DEPARTMENTS.find(x=>x.code===code); return d ? d.name : code; }
function desgName(code){ const d = DESIGNATIONS.find(x=>x.code===code); return d ? d.name : code; }
function nextMasterCode(list, prefix){
  let n = 1;
  const codes = new Set(list.map(x=>x.code));
  while(codes.has(prefix+n)) n++;
  return prefix+n;
}
function nextUnitCode(){ return nextMasterCode(UNITS, 'U'); }
function nextStaffRef(){ return nextMasterCode(STAFF.map(s=>({code:s.dbRef})), 'STF'); }

  }).join('')+
  '</tbody></table></div>'+
  '<div class="footnote">Codes ('+opts.prefix+'1, '+opts.prefix+'2…) are the permanent database reference and never change; renaming here only updates the display name. A '+opts.itemLabel.toLowerCase()+' in use by staff can\'t be removed — reassign those staff first.</div>';
  document.getElementById('masterAddBtn').onclick = ()=>{
    const nextCode = nextMasterCode(opts.list, opts.prefix);
    openMasterAddModal('Add '+opts.itemLabel.toLowerCase(), [
      {id:'name', label:opts.itemLabel+' name', placeholder:'e.g. '+(opts.exampleName||opts.itemLabel)},
    ], (v)=>{
      opts.onAdd(v.name);
    }, 'Code to be assigned: <span class="mono">'+nextCode+'</span> (permanent, auto-generated).');
  };
  body.querySelectorAll('input.editable').forEach(inp=>{
    inp.addEventListener('change', ()=> opts.onRename(parseInt(inp.dataset.idx), inp.value.trim()));
  });
  body.querySelectorAll('[data-del-idx]').forEach(btn=>{
    btn.onclick = ()=>{
      const i = parseInt(btn.dataset.delIdx);
      if(opts.usedCountFn(opts.list[i])>0){ alert('This '+opts.itemLabel.toLowerCase()+' is still assigned to staff — reassign them first.'); return; }
      opts.onRemove(i);
    };
  });
}

/* ---- Shift Planner ---- */
let plannerMonth = null;
let plannerQuery = '';
function allCycleDates(){
  const s = new Set();
  Object.values(ATTENDANCE).forEach(a=> a.records.forEach(r=> s.add(r.date)));
  return [...s].sort();
}
function monthsAvailable(){
  return [...new Set(allCycleDates().map(d=>d.slice(0,7)))].sort();
}
function monthLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-IN', {month:'long', year:'numeric'});
}
function renderShiftPlanner(){
  const body = document.getElementById('adminBody');
  const months = monthsAvailable();
  if(!plannerMonth) plannerMonth = months[0];
  const datesInMonth = allCycleDates().filter(d=> d.startsWith(plannerMonth));
  const filteredStaff = unitFilterStaff(STAFF).filter(e=> (e.name+e.empNo+deptName(e.department)).toLowerCase().includes(plannerQuery.toLowerCase()));

  const head = '<th class="mono">Code</th><th>Name</th>'+datesInMonth.map(d=>{
    const day = new Date(d+'T00:00:00');
    const isSun = day.getDay()===0;
    return '<th class="mono"'+(isSun?' style="color:var(--rose);"':'')+' title="'+d+'">'+day.getDate()+'</th>';
  }).join('');

  const rows = filteredStaff.map(s=>{
    const att = ATTENDANCE[s.empNo];
    const byDate = {}; att.records.forEach(r=> byDate[r.date]=r);
    const cells = datesInMonth.map(d=>{
      const rec = byDate[d];
      if(!rec || rec.status!=='P'){
        const label = rec ? ({WO:'WO',A:'A',CL:'CL'})[rec.status]||rec.status : '';
        return '<td class="mono" style="text-align:center;color:var(--slate-soft);font-size:11px;">'+label+'</td>';
      }
      const inMin = toMin(rec.in);
      const sh = effectiveShift(s.empNo, d, inMin);
      const overridden = isOverridden(s.empNo, d);
      const late = Math.max(0, inMin - shiftStartMin(sh));
      const grace = sh.allowedLateMin ?? 15;
      const cls = {S1:'planner-g', S2:'planner-s', S3:'planner-n'}[sh.code] || 'planner-x';
      return '<td style="text-align:center;">'+
        '<button class="planner-cell '+cls+(overridden?' planner-override':'')+'" data-emp="'+s.empNo+'" data-date="'+d+'" title="'+sh.name+(late>grace?' — '+late+'m late':'')+'">'+
          sh.letter+(late>grace?'<span class="planner-late-dot"></span>':'')+
        '</button>'+
      '</td>';
    }).join('');
    return '<tr><td class="mono">'+s.empNo+'</td><td>'+s.name+'</td>'+cells+'</tr>';
  }).join('');

  body.innerHTML = ''+
  '<div class="emp-toolbar">'+
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">'+
      '<select class="search" id="plannerMonthSel" style="min-width:160px;">'+months.map(m=>'<option value="'+m+'" '+(m===plannerMonth?'selected':'')+'>'+monthLabel(m)+'</option>').join('')+'</select>'+
      '<input class="search" id="plannerSearch" placeholder="Search staff..." value="'+escapeAttr(plannerQuery)+'" />'+
    '</div>'+
    '<div style="display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--slate);">'+
      '<span class="planner-cell planner-g" style="pointer-events:none;">G</span> General &nbsp;'+
      '<span class="planner-cell planner-s" style="pointer-events:none;">S</span> Second &nbsp;'+
      '<span class="planner-cell planner-n" style="pointer-events:none;">N</span> Night'+
    '</div>'+
  '</div>'+
  '<div class="tbl-scroll"><table class="narrow"><thead><tr>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div>'+
  '<div class="footnote">Click any shift badge to change that staff member\'s shift for that exact date — past, current or future, any time before the cycle\'s salary is finalized. A gold ring marks a manual override; a red dot marks a day that\'s late against whichever shift is in effect. Changes apply immediately to Shift Ledger, Salary and the staff member\'s own dashboard.</div>';

  document.getElementById('plannerMonthSel').onchange = (e)=>{ plannerMonth = e.target.value; renderShiftPlanner(); };
  document.getElementById('plannerSearch').oninput = (e)=>{ plannerQuery = e.target.value; renderShiftPlanner(); };
  body.querySelectorAll('.planner-cell[data-emp]').forEach(btn=>{
    btn.onclick = ()=>{
      const emp = btn.dataset.emp, date = btn.dataset.date;
      const rec = ATTENDANCE[emp].records.find(r=>r.date===date);
      const current = effectiveShift(emp, date, toMin(rec.in)).code;
      ROSTER[rosterKey(emp, date)] = nextShiftCode(current);
      renderShiftPlanner();
    };
  });
}

/* ---- lightweight themed CSS visuals (no external chart lib) ---- */
function dailyAttendanceSeries(scopedIds){
  const anyAtt = ATTENDANCE[Object.keys(ATTENDANCE)[0]];
  if(!anyAtt) return [];
  return anyAtt.records.map(r0=>{
    let present=0, total=0;
    scopedIds.forEach(id=>{
      const att = ATTENDANCE[id]; if(!att) return;
      const rec = att.records.find(r=>r.date===r0.date); if(!rec) return;
      if(rec.status==='WO' || rec.status==='H') return;
      total++; if(rec.status==='P') present++;
    });
    return {date:r0.date, pct: total? Math.round(present/total*100) : null};
  });
}
function miniBarChart(series, opts){
  opts = opts||{};
  const vals = series.map(s=>s.value).filter(v=>v!=null);
  const max = opts.max || Math.max(...vals, 1);
  return '<div style="display:flex;align-items:flex-end;gap:3px;height:90px;padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow-x:auto;">'+
    series.map(s=>{
      const h = s.value==null ? 3 : Math.max(4, Math.round((s.value/max)*76));
      return '<div title="'+escapeAttr(s.label+': '+(s.value==null?'no data':s.value+(opts.suffix||'')))+'" style="flex:0 0 auto;width:8px;height:'+h+'px;background:'+(s.value==null?'var(--line)':(opts.color||'var(--teal)'))+';border-radius:2px 2px 0 0;"></div>';
    }).join('')+
  '</div>';
}
function topList(items, opts){
  opts = opts||{};
  if(!items.length) return '<div class="note" style="padding:10px 0;">No data.</div>';
  const max = Math.max(...items.map(i=>i.value),1);
  return '<div style="display:flex;flex-direction:column;gap:7px;">'+
    items.map(i=>'<div style="display:flex;align-items:center;gap:8px;">'+
      '<div style="width:130px;font-size:12px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+i.label+'</div>'+
      '<div style="flex:1;background:var(--line);border-radius:5px;height:10px;overflow:hidden;"><div style="width:'+Math.max(4,Math.round(i.value/max*100))+'%;height:100%;background:'+(opts.color||'var(--rose)')+';"></div></div>'+
      '<div class="mono" style="width:'+(opts.valueWidth||'30px')+';text-align:right;font-size:12px;">'+i.value+'</div>'+
    '</div>').join('')+
  '</div>';
}
function stackedBar(segments){
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  return '<div style="display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--line);">'+
    segments.map(s=> s.value>0 ? '<div title="'+escapeAttr(s.label+': '+fmtMoney(s.value))+'" style="width:'+(s.value/total*100)+'%;background:'+s.color+';"></div>' : '').join('')+
  '</div>'+
  '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;">'+
    segments.map(s=>'<span style="font-size:11.5px;color:var(--slate);display:flex;align-items:center;gap:5px;"><span style="width:9px;height:9px;border-radius:2px;background:'+s.color+';display:inline-block;"></span>'+s.label+': '+fmtMoney(s.value)+'</span>').join('')+
  '</div>';
}

/* ================= Attendance import ================= */
function parseCSVLine(line){
  const cells = []; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(inQ){
      if(c==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else { inQ=false; } }
      else cur+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','){ cells.push(cur); cur=''; }
      else cur+=c;
    }
  }
  cells.push(cur);
  return cells;
}
const ATT_IMPORT_MONTHS = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
function parseDMonY(s){
  const m = /^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/.exec((s||'').trim());
  if(!m) return null;
  const key = m[2][0].toUpperCase()+m[2].slice(1,3).toLowerCase();
  const mo = ATT_IMPORT_MONTHS[key];
  if(!mo) return null;
  return m[3]+'-'+mo+'-'+(m[1].length===1?'0'+m[1]:m[1]);
}
function mapAttStatusText(s){
  s = (s||'').trim();
  if(/present/i.test(s)) return 'P';
  if(/weekly\s*off|week\s*off/i.test(s)) return 'WO';
  if(/holiday/i.test(s)) return 'H';
  if(/\bcl\b|casual\s*leave/i.test(s)) return 'CL';
  if(/absent|not\s*present/i.test(s)) return 'A';
  return null;
}
function parseAttendanceImportText(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  const head = lines.slice(0,6).join(' ');
  const result = {records:[], unmatchedCodes:new Set(), warnings:[], format:null};
  if(!lines.length) return result;
  if(/Employee\s*Punch\s*Monitor/i.test(head)){
    result.format = 'Employee Punch Monitor (single day)';
    let reportDate = null, headerSeen = false;
    for(const line of lines){
      const cells = parseCSVLine(line).map(c=>c.trim());
      if(!reportDate && /^date$/i.test(cells[0]||'')){
        const d = cells.slice(1).find(c=>parseDMonY(c));
        if(d) reportDate = parseDMonY(d);
        continue;
      }
      if(!headerSeen && /^sno/i.test(cells[0]||'')){ headerSeen = true; continue; }
      if(headerSeen){
        const code = cells[1];
        if(!code) continue;
        const punches = (cells[7]||'').split(',').map(p=>p.trim()).filter(Boolean);
        const status = mapAttStatusText(cells[9]) || (punches.length ? 'P' : 'A');
        if(!reportDate){ result.warnings.push('No report date found in the Punch Monitor header.'); continue; }
        const rec = {empNo: code, date: reportDate, status};
        if(punches.length){ rec.in = punches[0]; rec.out = punches[punches.length-1]; }
        result.records.push(rec);
      }
    }
  } else if(/Daily\s*Attendance\s*Report/i.test(head) || /DailyAttendance_SummaryReport/i.test(head)){
    result.format = 'Daily Attendance Summary Report (per-employee)';
    let curCode = null;
    for(const line of lines){
      const cells = parseCSVLine(line).map(c=>c.trim());
      if(/^Employee\s*Code:?$/i.test(cells[1]||'')){ curCode = cells[3] || null; continue; }
      if(/^Date$/i.test(cells[1]||'')) continue;
      if(/^Total\s*Duration=/i.test(cells[1]||'')) continue;
      const iso = parseDMonY(cells[1]);
      if(iso && curCode){
        const status = mapAttStatusText(cells[8]) || 'A';
        const rec = {empNo: curCode, date: iso, status};
        if(cells[3]) rec.in = cells[3];
        if(cells[4]) rec.out = cells[4];
        result.records.push(rec);
      }
    }
  } else {
    result.format = 'Generic CSV';
    const header = parseCSVLine(lines[0]).map(c=>c.trim().toLowerCase());
    const idx = (re)=> header.findIndex(h=>re.test(h));
    const cCode = idx(/emp.*code|^code$/), cDate = idx(/date/), cStatus = idx(/status/), cIn = idx(/in.?time|check.?in|^in$/), cOut = idx(/out.?time|check.?out|^out$/);
    if(cCode<0 || cDate<0){
      result.warnings.push('Could not find header columns for employee code and date.');
    } else {
      for(let i=1;i<lines.length;i++){
        const cells = parseCSVLine(lines[i]).map(c=>c.trim());
        const code = cells[cCode]; if(!code) continue;
        const dateRaw = cells[cDate];
        let iso = /^\d{4}-\d{2}-\d{2}$/.test(dateRaw) ? dateRaw : parseDMonY(dateRaw);
        if(!iso){ const m=/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/.exec(dateRaw); if(m) iso = m[3]+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0'); }
        if(!iso) continue;
        const rawStatus = cStatus>=0 ? cells[cStatus] : '';
        const status = mapAttStatusText(rawStatus) || (rawStatus ? rawStatus.toUpperCase().slice(0,2) : 'P');
        const rec = {empNo: code, date: iso, status};
        if(cIn>=0 && cells[cIn]) rec.in = cells[cIn];
        if(cOut>=0 && cells[cOut]) rec.out = cells[cOut];
        result.records.push(rec);
      }
    }
  }
  const knownCodes = new Set(STAFF.map(s=>s.empNo));
  result.records.forEach(r=>{ if(!knownCodes.has(r.empNo)) result.unmatchedCodes.add(r.empNo); });
  return result;
}

function commitAttendanceImport(records){
  let added=0, updated=0;
  records.forEach(r=>{
    if(!ATTENDANCE[r.empNo]) ATTENDANCE[r.empNo] = {primaryShift:null, records:[]};
    const list = ATTENDANCE[r.empNo].records;
    const existing = list.find(x=>x.date===r.date);
    if(existing){
      existing.status = r.status;
      if(r.in) existing.in = r.in; else delete existing.in;
      if(r.out) existing.out = r.out; else delete existing.out;
      updated++;
    } else {
      const rec = {date:r.date, status:r.status};
      if(r.in) rec.in = r.in;
      if(r.out) rec.out = r.out;
      list.push(rec);
      added++;
    }
    list.sort((a,b)=>a.date.localeCompare(b.date));
  });
  document.getElementById('modalRoot').innerHTML = '';
  alert('Import complete: '+added+' new record(s) added, '+updated+' existing record(s) updated.');
  renderAdminLedger();
}

function applyApprovedLeaveToAttendance(l){
  // Only CL changes the payroll calculation directly (the day is excused).
  // Permission usage is already derived automatically from that day's actual
  // punch times in computeCycle, so an approved Permission request is informational.
  if(l.type!=='CL') return;
  const att = ATTENDANCE[l.empNo];
  if(!att) return;
  const rec = att.records.find(r=>r.date===l.date);
  if(rec){ rec.status='CL'; delete rec.in; delete rec.out; }
  else { att.records.push({date:l.date, status:'CL'}); att.records.sort((a,b)=>a.date.localeCompare(b.date)); }
}

async function exportCSV(filename, headers, rows){
  const esc = (v)=> '"'+String(v??'').replace(/"/g,'""')+'"';
  const csv = [headers.map(esc).join(',')].concat(rows.map(r=>r.map(esc).join(','))).join('\r\n');
  // Published Claude artifacts can't trigger a plain <a download> link — the
  // viewer never grants that. Use the downloads capability there; fall back
  // to a normal browser download when running as a plain file (e.g. once
  // handed off to Lovable, or opened locally after SendUserFile).
  if(window.claude && typeof window.claude.use==='function'){
    try{
      const downloads = await window.claude.use('downloads');
      if(downloads){ await downloads.save({filename, data:csv}); return; }
    }catch(e){ /* fall through to the plain-browser download below */ }
  }
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

    rows.map(({e,r})=>[e.empNo,e.name,deptName(e.department),r.summary.otMinutesTotal,(r.summary.otMinutesTotal/60).toFixed(1),r.summary.otPay.toFixed(2)]));
}

function renderReportTasks(){
  const body = document.getElementById('reportsBody');
  const scoped = TASKS.filter(t=>inSelectedUnit(t.assignedTo));
  const headers = ['ID','Title','Assigned to','Assigned by','Created','Due','Status','Completed on','Turnaround (days)'];
  const rows = scoped.map(t=>{
    const a = findStaff(t.assignedTo); const byName = (findStaff(t.assignedBy)||{}).name || accountName(t.assignedBy) || t.assignedBy;
    const turnaround = (t.completionDate && t.createdDate) ? Math.round((new Date(t.completionDate)-new Date(t.createdDate))/86400000) : '';
    return {t, a, byName, turnaround};
  });
  body.innerHTML = reportShell('Task completion & turnaround', 'Turnaround is calendar days between assignment and the employee marking it finished.',
    headers,
    rows.map(({t,a,byName,turnaround})=>'<tr><td class="mono">'+t.id+'</td><td>'+t.title+'</td><td>'+(a?a.name:t.assignedTo)+'</td><td>'+byName+'</td><td class="mono">'+fmtDate(t.createdDate)+'</td><td class="mono">'+fmtDate(t.dueDate)+'</td><td>'+statusPill(t.status)+'</td><td class="mono">'+(t.completionDate?fmtDate(t.completionDate):'—')+'</td><td class="mono">'+(turnaround!==''?turnaround:'—')+'</td></tr>').join('')
  );
  document.getElementById('reportExportBtn').onclick = ()=> exportCSV('task_completion.csv', headers,
    rows.map(({t,a,byName,turnaround})=>[t.id,t.title,a?a.name:t.assignedTo,byName,t.createdDate,t.dueDate,t.status,t.completionDate||'',turnaround]));
}

function renderReportAudit(){
  const body = document.getElementById('reportsBody');
  const scopedIds = new Set(unitFilterStaff(STAFF).map(s=>s.empNo));
  const entries = [];
  LEAVES.filter(l=>l.decidedBy && scopedIds.has(l.empNo)).forEach(l=>{
    const s = findStaff(l.empNo);
    entries.push({date:l.decidedOn, type:'Leave/Permission', ref:l.id, staff:s?s.name:l.empNo, action:l.status, by:l.decidedBy});
  });
  TASKS.filter(t=>t.reviewedBy && scopedIds.has(t.assignedTo)).forEach(t=>{
    const a = findStaff(t.assignedTo);
    entries.push({date:t.reviewedOn, type:'Task', ref:t.id, staff:a?a.name:t.assignedTo, action:t.status, by:t.reviewedBy});
  });
  entries.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  const headers = ['Date','Type','Reference','Staff','Action','By'];
  body.innerHTML = reportShell('Audit trail', 'Every recorded leave/permission decision and task review, most recent first.',
    headers,
    entries.map(x=>'<tr><td class="mono">'+fmtDate(x.date)+'</td><td>'+x.type+'</td><td class="mono">'+x.ref+'</td><td>'+x.staff+'</td><td>'+statusPill(x.action)+'</td><td>'+x.by+'</td></tr>').join('')
  );
  document.getElementById('reportExportBtn').onclick = ()=> exportCSV('audit_trail.csv', headers,
    entries.map(x=>[x.date,x.type,x.ref,x.staff,x.action,x.by]));
}

/* ================= PWA install ================= */
let deferredInstallPrompt = null;
const installBtn = document.getElementById('installAppBtn');
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true; }
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  if(!isStandalone()) installBtn.classList.remove('hidden');
});
window.addEventListener('appinstalled', ()=>{ installBtn.classList.add('hidden'); deferredInstallPrompt = null; });
if(isIOS() && !isStandalone()){ installBtn.classList.remove('hidden'); }
installBtn.onclick = async ()=>{
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    installBtn.classList.add('hidden');
    return;
  }
  openIOSInstallModal();
};
function openIOSInstallModal(){
  const modalRoot = document.getElementById('modalRoot');
  modalRoot.innerHTML = ''+
  '<div class="modal-back" id="modalBack"><div class="modal narrow">'+
    '<div class="modal-head"><h3 style="font-size:15px;">Add to Home Screen</h3><button class="closebtn" id="modalClose">✕</button></div>'+
    '<div class="modal-body">'+
      '<p style="margin-top:0;">On iPhone / iPad (Safari):</p>'+
      '<ol style="padding-left:18px; line-height:1.9;">'+
        '<li>Tap the <b>Share</b> icon in the toolbar.</li>'+
        '<li>Scroll down and tap <b>"Add to Home Screen"</b>.</li>'+
        '<li>Tap <b>Add</b> — Selvantra HRMS now opens full-screen like an app, with an offline-friendly app shell.</li>'+
      '</ol>'+
      '<p class="hint">On Android / Desktop Chrome, the "Install app" button installs it directly — no browser menu needed.</p>'+
    '</div>'+
  '</div></div>';
  document.getElementById('modalClose').onclick = ()=> modalRoot.innerHTML='';
  document.getElementById('modalBack').addEventListener('click', e=>{ if(e.target.id==='modalBack') modalRoot.innerHTML=''; });
}
