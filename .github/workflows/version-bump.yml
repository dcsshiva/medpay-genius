name: Auto Version Bump and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major

jobs:
  version-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Configure Git
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"

    - name: Bump version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION_TYPE="${{ github.event.inputs.version_type }}"
        else
          # Auto-detect version type based on commit messages
          if git log --format=%B -n 1 | grep -E "BREAKING CHANGE|feat!|fix!" -q; then
            VERSION_TYPE="major"
          elif git log --format=%B -n 1 | grep -E "^feat" -q; then
            VERSION_TYPE="minor"
          else
            VERSION_TYPE="patch"
          fi
        fi
        
        echo "Bumping $VERSION_TYPE version"
        NEW_VERSION=$(npm version $VERSION_TYPE --no-git-tag-version)
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "version_type=$VERSION_TYPE" >> $GITHUB_OUTPUT

    - name: Update version in files
      run: |
        # Update version in package.json (already done by npm version)
        # Create build info for injection
        cat > public/build-info.json << EOF
        {
          "version": "${{ steps.version.outputs.new_version }}",
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)",
          "commit": "${{ github.sha }}",
          "branch": "${{ github.ref_name }}",
          "environment": "production"
        }
        EOF

    - name: Generate Changelog
      id: changelog
      run: |
        # Simple changelog generation
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREVIOUS_TAG" ]; then
          CHANGES=$(git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD)
        else
          CHANGES=$(git log --pretty=format:"- %s (%h)" --max-count=10)
        fi
        
        echo "## ${{ steps.version.outputs.new_version }}" > CURRENT_CHANGELOG.md
        echo "**Release Date:** $(date -u +%Y-%m-%d)" >> CURRENT_CHANGELOG.md
        echo "" >> CURRENT_CHANGELOG.md
        echo "**Changes:**" >> CURRENT_CHANGELOG.md
        echo "$CHANGES" >> CURRENT_CHANGELOG.md

    - name: Build application
      run: |
        # Inject build info into the build process
        export VITE_BUILD_VERSION="${{ steps.version.outputs.new_version }}"
        export VITE_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
        export VITE_BUILD_COMMIT="${{ github.sha }}"
        export VITE_BUILD_BRANCH="${{ github.ref_name }}"
        npm run build

    - name: Commit version bump
      run: |
        git add package.json package-lock.json public/build-info.json CURRENT_CHANGELOG.md
        git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} [skip ci]"
        git tag ${{ steps.version.outputs.new_version }}

    - name: Push changes
      run: |
        git push origin main
        git push origin ${{ steps.version.outputs.new_version }}

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.new_version }}
        release_name: Release ${{ steps.version.outputs.new_version }}
        body_path: CURRENT_CHANGELOG.md
        draft: false
        prerelease: false

    - name: Deploy to Production
      run: |
        echo "🚀 Deploying version ${{ steps.version.outputs.new_version }} to production"
        # Add your deployment commands here
        # For example, if using Vercel, Netlify, or other platforms
        # This could also trigger a webhook to your hosting platform