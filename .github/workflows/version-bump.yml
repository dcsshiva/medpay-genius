name: Release version

# Every push to main is a release: bump the release number in package.json, stamp the
# release time (package.json → releasedAt, shown in the app as "Released <date, time>"),
# commit, tag and create a GitHub release. The app is built and published by Lovable;
# this job only versions it, so it needs no dependency install or build.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'release'
        type: choice
        options:
        - release
        - minor
        - major

permissions:
  contents: write

concurrency:
  group: release-version
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Configure Git
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"

    - name: Bump version
      id: version
      env:
        DISPATCH_TYPE: ${{ github.event.inputs.version_type }}
      run: |
        if [ -n "$DISPATCH_TYPE" ]; then
          VERSION_TYPE="$DISPATCH_TYPE"
        elif git log --format=%B -n 1 | grep -Eq "BREAKING CHANGE|feat!|fix!"; then
          VERSION_TYPE="major"
        elif git log --format=%B -n 1 | grep -Eq "^feat"; then
          VERSION_TYPE="minor"
        else
          VERSION_TYPE="release"
        fi
        echo "Bumping $VERSION_TYPE version"
        NEW_VERSION=$(node scripts/bump-release.cjs "$VERSION_TYPE")
        echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

    - name: Commit, tag and push
      env:
        NEW_VERSION: ${{ steps.version.outputs.new_version }}
      run: |
        git add package.json package-lock.json
        git commit -m "chore(release): $NEW_VERSION [skip ci]"
        git tag "$NEW_VERSION"
        # main may have moved while this ran (e.g. a Lovable sync): rebase onto it, retag, push
        for attempt in 1 2 3; do
          if git push origin HEAD:main; then break; fi
          git pull --rebase origin main
          git tag -f "$NEW_VERSION"
          [ "$attempt" = 3 ] && exit 1
        done
        git push origin "$NEW_VERSION"

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NEW_VERSION: ${{ steps.version.outputs.new_version }}
      run: gh release create "$NEW_VERSION" --title "Release $NEW_VERSION" --generate-notes
